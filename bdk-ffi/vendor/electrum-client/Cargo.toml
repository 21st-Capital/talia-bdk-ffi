[package]
edition = "2021"
rust-version = "1.75.0"
name = "electrum-client"
version = "0.25.0"
authors = ["Alekos Filini <alekos.filini@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Bitcoin Electrum client library. Supports plaintext, TLS and Onion servers."
homepage = "https://github.com/bitcoindevkit/rust-electrum-client"
documentation = "https://docs.rs/electrum-client/"
readme = "README.md"
keywords = [
    "bitcoin",
    "electrum",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitcoindevkit/rust-electrum-client"

[features]
default = [
    "proxy",
    "rustls",
]
openssl = ["dep:openssl"]
proxy = [
    "byteorder",
    "winapi",
    "libc",
]
rustls = [
    "webpki-roots",
    "dep:rustls",
    "rustls/default",
]
# TALIA FORK: `rustls?/...` instead of `rustls/...`. In a feature list, `rustls/ring` also
# switches on this crate's own feature named "rustls", which adds `rustls/default`, which is
# aws-lc-rs: so "rustls-ring" built both crypto providers (C code included). With `?` it only
# sets features on the rustls dependency that `dep:rustls` already enables.
rustls-ring = [
    "webpki-roots",
    "dep:rustls",
    "rustls?/ring",
    "rustls?/logging",
    "rustls?/std",
    "rustls?/tls12",
]
use-openssl = ["openssl"]
use-rustls = ["rustls"]
use-rustls-ring = ["rustls-ring"]

[lib]
name = "electrum_client"
path = "src/lib.rs"

[[example]]
name = "jwt_auth"
path = "examples/jwt_auth.rs"

[[example]]
name = "jwt_dynamic_auth"
path = "examples/jwt_dynamic_auth.rs"

[[example]]
name = "plaintext"
path = "examples/plaintext.rs"

[[example]]
name = "ssl"
path = "examples/ssl.rs"

[[example]]
name = "tor"
path = "examples/tor.rs"

[dependencies.bitcoin]
version = "0.32"
features = ["serde"]

[dependencies.byteorder]
version = "1.0"
optional = true

[dependencies.log]
version = "^0.4"

[dependencies.openssl]
version = "0.10"
optional = true

# TALIA FORK: at least 0.23.46 (RUSTSEC-2026-0346 to -0349 affect 0.23.45).
[dependencies.rustls]
version = "0.23.46"
optional = true
default-features = false

[dependencies.serde]
version = "^1.0"
features = ["derive"]

[dependencies.serde_json]
version = "^1.0"

# TALIA FORK: the current Mozilla root list (webpki-roots 1.0), as in Talia's 0.28 line, which
# leaves out the roots Mozilla has since removed or distrusted.
[dependencies.webpki-roots]
version = "1.0.9"
optional = true

[dev-dependencies.bitreq]
version = "0.3.4"
features = [
    "async-https",
    "json-using-serde",
]

[dev-dependencies.tokio]
version = "1"
features = ["full"]

[target."cfg(unix)".dependencies.libc]
version = "0.2"
optional = true

[target."cfg(windows)".dependencies.winapi]
version = "0.3.9"
features = ["winsock2"]
optional = true
